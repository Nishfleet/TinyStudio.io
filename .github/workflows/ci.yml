name: CI

on:
  pull_request:
  push:
    branches: [main]


# Supersede in-flight runs for the same ref: a newer push makes the older
# run's result irrelevant. GitHub's documented lever for duplicate CI work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      # Browser step for the render-blocking guarantee (dogfood finding
      # b8f6046e942a): the static guards prove the blocking shape cannot
      # return, this step proves the served pages actually render without it.
      - name: Render-blocking regression check (real Chromium)
        run: |
          npx playwright install chromium
          npm run check:render-blocking
      - name: Wrangler config and bundle check
        run: npm run deploy:dry-run
