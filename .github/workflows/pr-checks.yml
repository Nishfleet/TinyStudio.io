name: PR checks

# Consolidated pull-request validation gate for TinyStudio.io. Two
# separate workflows (CI, Secret Scan) paid two controller spin-ups per
# PR; they now share one workflow. Every job name the branch-protection
# rules reference is preserved exactly: `verify` and `Gitleaks`.
#
# Concurrency with cancel-in-progress bounds the queue to one live run
# per PR head / main ref. Superseded runs cancel instead of queueing
# behind each other. Observed on this repo: 1 superseded run/week before
# this change; the saving is smaller here than on aiconverter-app because
# this repo's supersede rate is lower, but the queue bound still matters.
#
# Docs-only fast path inside each required-context job: the
# ./.github/actions/docs-classify composite action classifies every PR
# conservatively. When the diff is prose/evidence only, each job reaches
# a real success conclusion in ~5s by skipping its heavy install / build
# / test steps. The job ALWAYS runs - a SKIPPED required context counts
# as SATISFIED, which is the failure this rule exists to avoid (standing
# rule 2026-08-23).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # Observed history (origin/main ci.yml::verify): median ~1.8min, healthy
    # max ~2.7min. The 1102.9min outlier was a queued run, not execution.
    # 15min is ~5x the healthy max and well under the 360min hosted-runner
    # cap; a hang here would otherwise hold the pr-checks concurrency group
    # indefinitely (the 2026-08-23/24 fleet stall).
    timeout-minutes: 15
    steps:
      - name: Classify the PR (docs-only fast path)
        id: docs
        uses: ./.github/actions/docs-classify
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Docs-only fast path
        if: steps.docs.outputs.docs-only == 'true'
        run: |
          echo "::notice::Docs-only PR - verify skipped."
      - name: Checkout
        if: steps.docs.outputs.docs-only != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        if: steps.docs.outputs.docs-only != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: steps.docs.outputs.docs-only != 'true'
        run: npm ci
      - name: Install Playwright Chromium
        if: steps.docs.outputs.docs-only != 'true'
        run: npx playwright install chromium
      - name: Run unit tests
        if: steps.docs.outputs.docs-only != 'true'
        run: npm test
      # Browser step for the render-blocking guarantee (dogfood finding
      # b8f6046e942a): the static guards prove the blocking shape cannot
      # return, this step proves the served pages actually render without it.
      - name: Render-blocking regression check (real Chromium)
        if: steps.docs.outputs.docs-only != 'true'
        run: |
          npx playwright install chromium
          npm run check:render-blocking
      - name: Wrangler config and bundle check
        if: steps.docs.outputs.docs-only != 'true'
        run: npm run deploy:dry-run

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    # Observed history (origin/main secret-scan.yml::gitleaks): median ~0.3min,
    # healthy max ~0.5min. 10min is ~20x the healthy max and well under the
    # 360min hosted-runner cap; a hang here would otherwise hold the pr-checks
    # concurrency group indefinitely.
    timeout-minutes: 10
    steps:
      - name: Classify the PR (docs-only fast path)
        id: docs
        uses: ./.github/actions/docs-classify
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Docs-only fast path
        if: steps.docs.outputs.docs-only == 'true'
        run: |
          echo "::notice::Docs-only PR - Gitleaks skipped."
      - name: Checkout
        if: steps.docs.outputs.docs-only != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository
        if: steps.docs.outputs.docs-only != 'true'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMPDIR: ${{ runner.temp }}
